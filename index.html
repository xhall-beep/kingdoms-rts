<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Kingdoms RTS</title><style>:root {
  --text: #6b6375;
  --text-h: #08060d;
  --bg: #fff;
  --border: #e5e4e7;
  --code-bg: #f4f3ec;
  --accent: #aa3bff;
  --accent-bg: rgba(170, 59, 255, 0.1);
  --accent-border: rgba(170, 59, 255, 0.5);
  --social-bg: rgba(244, 243, 236, 0.5);
  --shadow:
    rgba(0, 0, 0, 0.1) 0 10px 15px -3px, rgba(0, 0, 0, 0.05) 0 4px 6px -2px;

  --sans: system-ui, 'Segoe UI', Roboto, sans-serif;
  --heading: system-ui, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, Consolas, monospace;

  font: 18px/145% var(--sans);
  letter-spacing: 0.18px;
  color-scheme: light dark;
  color: var(--text);
  background: var(--bg);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;

  @media (max-width: 1024px) {
    font-size: 16px;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --text: #9ca3af;
    --text-h: #f3f4f6;
    --bg: #16171d;
    --border: #2e303a;
    --code-bg: #1f2028;
    --accent: #c084fc;
    --accent-bg: rgba(192, 132, 252, 0.15);
    --accent-border: rgba(192, 132, 252, 0.5);
    --social-bg: rgba(47, 48, 58, 0.5);
    --shadow:
      rgba(0, 0, 0, 0.4) 0 10px 15px -3px, rgba(0, 0, 0, 0.25) 0 4px 6px -2px;
  }

  #social .button-icon {
    filter: invert(1) brightness(2);
  }
}

body {
  margin: 0;
}

h1,
h2 {
  font-family: var(--heading);
  font-weight: 500;
  color: var(--text-h);
}

h1 {
  font-size: 56px;
  letter-spacing: -1.68px;
  margin: 32px 0;
  @media (max-width: 1024px) {
    font-size: 36px;
    margin: 20px 0;
  }
}
h2 {
  font-size: 24px;
  line-height: 118%;
  letter-spacing: -0.24px;
  margin: 0 0 8px;
  @media (max-width: 1024px) {
    font-size: 20px;
  }
}
p {
  margin: 0;
}

code,
.counter {
  font-family: var(--mono);
  display: inline-flex;
  border-radius: 4px;
  color: var(--text-h);
}

code {
  font-size: 15px;
  line-height: 135%;
  padding: 4px 8px;
  background: var(--code-bg);
}

.counter {
  font-size: 16px;
  padding: 5px 10px;
  border-radius: 5px;
  color: var(--accent);
  background: var(--accent-bg);
  border: 2px solid transparent;
  transition: border-color 0.3s;
  margin-bottom: 24px;

  &:hover {
    border-color: var(--accent-border);
  }
  &:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
}

.hero {
  position: relative;

  .base,
  .framework,
  .vite {
    inset-inline: 0;
    margin: 0 auto;
  }

  .base {
    width: 170px;
    position: relative;
    z-index: 0;
  }

  .framework,
  .vite {
    position: absolute;
  }

  .framework {
    z-index: 1;
    top: 34px;
    height: 28px;
    transform: perspective(2000px) rotateZ(300deg) rotateX(44deg) rotateY(39deg)
      scale(1.4);
  }

  .vite {
    z-index: 0;
    top: 107px;
    height: 26px;
    width: auto;
    transform: perspective(2000px) rotateZ(300deg) rotateX(40deg) rotateY(39deg)
      scale(0.8);
  }
}

#app {
  width: 1126px;
  max-width: 100%;
  margin: 0 auto;
  text-align: center;
  border-inline: 1px solid var(--border);
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

#center {
  display: flex;
  flex-direction: column;
  gap: 25px;
  place-content: center;
  place-items: center;
  flex-grow: 1;

  @media (max-width: 1024px) {
    padding: 32px 20px 24px;
    gap: 18px;
  }
}

#next-steps {
  display: flex;
  border-top: 1px solid var(--border);
  text-align: left;

  & > div {
    flex: 1 1 0;
    padding: 32px;
    @media (max-width: 1024px) {
      padding: 24px 20px;
    }
  }

  .icon {
    margin-bottom: 16px;
    width: 22px;
    height: 22px;
  }

  @media (max-width: 1024px) {
    flex-direction: column;
    text-align: center;
  }
}

#docs {
  border-right: 1px solid var(--border);

  @media (max-width: 1024px) {
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
}

#next-steps ul {
  list-style: none;
  padding: 0;
  display: flex;
  gap: 8px;
  margin: 32px 0 0;

  .logo {
    height: 18px;
  }

  a {
    color: var(--text-h);
    font-size: 16px;
    border-radius: 6px;
    background: var(--social-bg);
    display: flex;
    padding: 6px 12px;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: box-shadow 0.3s;

    &:hover {
      box-shadow: var(--shadow);
    }
    .button-icon {
      height: 18px;
      width: 18px;
    }
  }

  @media (max-width: 1024px) {
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;

    li {
      flex: 1 1 calc(50% - 8px);
    }

    a {
      width: 100%;
      justify-content: center;
      box-sizing: border-box;
    }
  }
}

#spacer {
  height: 88px;
  border-top: 1px solid var(--border);
  @media (max-width: 1024px) {
    height: 48px;
  }
}

.ticks {
  position: relative;
  width: 100%;

  &::before,
  &::after {
    content: '';
    position: absolute;
    top: -4.5px;
    border: 5px solid transparent;
  }

  &::before {
    left: 0;
    border-left-color: var(--border);
  }
  &::after {
    right: 0;
    border-right-color: var(--border);
  }
}

/* ---- Kingdoms RTS game shell ---- */
.game-shell {
  position: fixed;
  inset: 0;
  background: #0c1410;
  overflow: hidden;
  font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
}

.game-stage {
  position: absolute;
  inset: 0;
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
}

#hud-root {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  pointer-events: none;
  padding: 10px;
}

.hud-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.hud-pill {
  background: rgba(16, 43, 43, 0.9);
  border: 2px solid rgba(255, 243, 212, 0.2);
  border-radius: 999px;
  color: #fff3d4;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 12px;
  white-space: nowrap;
}

.hud-pill b {
  color: #fff;
  margin-left: 4px;
}

.hud-gold b { color: #f5c542; }
.hud-wood b { color: #7fd08a; }
.hud-info { margin-left: auto; opacity: 0.85; }

.hud-modes {
  margin-top: 8px;
}

.hud-mode {
  cursor: pointer;
  font: inherit;
  pointer-events: auto;
  min-height: 44px;
  padding: 6px 16px;
}

.hud-mode-on {
  background: #f5c542;
  color: #102b2b;
  border-color: #f5c542;
}

.hud-actions {
  margin-top: 8px;
  min-height: 0;
}

.hud-actions:empty {
  display: none;
}

.hud-action {
  cursor: pointer;
  font: inherit;
  pointer-events: auto;
  min-height: 44px;
  padding: 6px 16px;
  background: rgba(20, 60, 50, 0.92);
}

.hud-action:disabled {
  opacity: 0.4;
  cursor: default;
}

.hud-banner {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  font-weight: 800;
  padding: 24px 48px;
  border-radius: 16px;
  pointer-events: none;
}

.hud-banner[hidden] {
  display: none;
}

.hud-win {
  background: rgba(20, 80, 40, 0.95);
  color: #d1fae5;
  border: 3px solid #4ade80;
}

.hud-lose {
  background: rgba(80, 20, 20, 0.95);
  color: #fee2e2;
  border: 3px solid #ef4444;
}

.hud-session {
  margin-top: 8px;
}

/* Fix: hidden attribute must win over flex display. */
.hud-bar[hidden],
.hud-menu[hidden],
.hud-banner[hidden] {
  display: none !important;
}

/* Compact top bar with menu button. */
.hud-top {
  margin-bottom: 0;
}

.hud-menu-btn {
  cursor: pointer;
  font: inherit;
  pointer-events: auto;
  margin-left: auto;
  min-width: 44px;
  min-height: 44px;
  font-size: 18px;
  line-height: 1;
}

/* Dropdown menu panel for session controls. */
.hud-menu {
  position: absolute;
  top: 100%;
  right: 10px;
  background: rgba(10, 28, 28, 0.97);
  border: 2px solid rgba(255, 243, 212, 0.25);
  border-radius: 12px;
  padding: 10px;
  z-index: 20;
  pointer-events: auto;
  min-width: 200px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

.hud-menu .hud-bar {
  margin-bottom: 8px;
}

.hud-menu .hud-bar:last-child {
  margin-bottom: 0;
}

.hud-speed-on {
  background: #f5c542;
  color: #102b2b;
  border-color: #f5c542;
}

.hud-detail {
  background: rgba(16, 43, 43, 0.7);
  border-color: rgba(255, 243, 212, 0.12);
  font-weight: 400;
  opacity: 0.9;
}

.hud-buildings {
  gap: 6px;
}
.hud-building {
  background: rgba(43, 32, 16, 0.7);
  border-color: rgba(255, 200, 100, 0.25);
  font-size: 12px;
}
.hud-building:active {
  background: rgba(80, 60, 30, 0.8);
}

.hud-tutorial{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#102b2bf2;border:3px solid #f5c542;border-radius:16px;padding:24px;max-width:320px;color:#fff3d4;z-index:100}
.hud-tutorial[hidden]{display:none}
.hud-tutorial h2{margin:0 0 12px;color:#f5c542}
.hud-tutorial p{margin:8px 0;font-size:14px;line-height:1.4}
.hud-tutorial button{margin-top:12px;min-height:44px;padding:8px 24px;font:inherit;font-weight:700;background:#f5c542;color:#102b2b;border:none;border-radius:8px;cursor:pointer}

/* --- RTS Command Card --- */
.cmd-card{pointer-events:auto;background:#0f2b2bf2;border:2px solid #f5c54233;border-radius:16px;padding:12px;margin-top:8px;max-width:100%}
.cmd-header{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.cmd-portrait{width:56px;height:56px;min-width:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;border:2px solid #ffffff33}
.cmd-title-wrap{flex:1;min-width:0}
.cmd-title{font-size:17px;font-weight:800;color:#fff3d4;margin-bottom:4px}
.cmd-hpbar{height:8px;background:#1a1a1a;border-radius:4px;overflow:hidden;margin-bottom:2px}
.cmd-hpfill{height:100%;border-radius:4px;transition:width 0.2s}
.cmd-hptext{font-size:11px;color:#fff3d488}
.cmd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.cmd-stat{background:#1a3a34;border-radius:8px;padding:6px 8px;text-align:center}
.cmd-stat-label{font-size:10px;color:#fff3d466;text-transform:uppercase;letter-spacing:0.5px}
.cmd-stat-value{font-size:14px;font-weight:700;color:#fff3d4}
.cmd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd-btn{min-height:52px;border-radius:10px;border:2px solid #f5c54244;background:#143c32;color:#fff3d4;font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px}
.cmd-btn:active{background:#1f5a4c}
.cmd-btn:disabled{opacity:0.35;cursor:default}
.cmd-btn-label{line-height:1.2}
.cmd-btn-hotkey{font-size:10px;color:#f5c54288;font-weight:400}

/* PvP Lobby */
.pvp-lobby {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.pvp-lobby[hidden] { display: none; }
.pvp-lobby-panel {
  background: #1a1a2e;
  border: 2px solid #4a4a6a;
  border-radius: 12px;
  padding: 24px;
  min-width: 280px;
  max-width: 90vw;
  color: #fff;
  text-align: center;
}
.pvp-lobby-panel h2 { margin: 0 0 16px 0; }
.pvp-row { margin: 12px 0; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.pvp-row input[type="text"] {
  padding: 8px 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #4a4a6a;
  background: #0f0f1a;
  color: #fff;
  min-height: 44px;
}
.pvp-code {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 8px;
  color: #ffd700;
  margin: 8px 0;
}
.pvp-waiting { color: #888; font-style: italic; }
.pvp-status { margin-top: 12px; color: #aaa; min-height: 20px; }

/* Quick Match */
.pvp-quick {
  font-size: 18px !important;
  padding: 12px 24px !important;
  background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%) !important;
  color: #fff !important;
  border: none !important;
}
.pvp-searching {
  font-size: 16px;
  animation: pvp-pulse 1.5s ease-in-out infinite;
}
@keyframes pvp-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
#pvp-queue-display[hidden] { display: none; }
