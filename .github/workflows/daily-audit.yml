name: Daily audit

"on":
  schedule:
    - cron: "38 12 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check live site
        run: |
          code=$(curl -fsS -o /dev/null -w "%{http_code}" https://xhall-beep.github.io/kingdoms-rts/)
          test "$code" = "200"
